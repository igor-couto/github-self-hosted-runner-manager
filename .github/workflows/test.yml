name: Build
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - run: dotnet build -c Release
      - run: bash -n install.sh && shellcheck install.sh
      - name: Build Linux release for installer tests
        run: dotnet publish -c Release -r linux-x64 --self-contained true -p:InvariantGlobalization=true -o artifacts/package-linux-x64
      - name: Test installation and rollback in an isolated Linux container
        run: |
          docker build -f tests/installer.Dockerfile -t runner-room-installer-test .
          docker run --rm runner-room-installer-test
