name: Build
on: [push, pull_request]
jobs:
  deployments:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Helm and test the Compose deployment
        run: node tests/deployment.cjs
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - run: dotnet build src/RunnerRoom/RunnerRoom.csproj -c Release
      - run: dotnet run --project tests/RunnerRoom.Tests -c Release
      - name: Test managed runner lifecycle as a non-root Linux account
        run: |
          docker build -f tests/management.Dockerfile -t runner-room-management-checks .
          docker run --rm runner-room-management-checks
      - run: bash -n install.sh && bash -n uninstall.sh && bash -n deploy/linux/update-service.sh && shellcheck install.sh uninstall.sh deploy/linux/update-service.sh
      - name: Build Linux release for installer tests
        run: dotnet publish src/RunnerRoom/RunnerRoom.csproj -c Release -r linux-x64 --self-contained true -p:InvariantGlobalization=true -o artifacts/package-linux-x64
      - name: Test installation and rollback in an isolated Linux container
        run: |
          docker build -f tests/installer.Dockerfile -t runner-room-installer-test .
          docker run --rm runner-room-installer-test
